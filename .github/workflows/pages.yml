# The probe as a web page, so that adding a machine to the catalogue is
# "open a link in Chrome, press a button, drag the file into an issue" — no
# install, no terminal. docs/16, 3.4: the catalogue is limited by access to
# machines, and every step between a volunteer and the file costs volunteers.
#
# Enable once in the repository: Settings → Pages → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [xchange]
    paths:
      - tools/detect-suite/probe.html
      - tools/detect-suite/probe.js
      - tools/detect-suite/sw-probe.js
      - tools/detect-suite/site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only the probe and the landing page. Nothing else in detect-suite is
      # meant for a browser that is not ours.
      - run: |
          mkdir -p _site
          cp tools/detect-suite/probe.html tools/detect-suite/probe.js tools/detect-suite/sw-probe.js _site/
          cp tools/detect-suite/site/index.html _site/index.html
      # GitHub Pages on a private repository needs GitHub Pro or higher. The
      # Free plan refuses to enable it, so the deploy steps are skipped rather
      # than turning every push that touches the probe red.
      - name: is GitHub Pages available?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository (private repositories need GitHub Pro or higher); skipping the deploy."
          fi

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.pages.outputs.enabled == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
